name: release

on:
  workflow_dispatch:
  push:
    tags:
      - v0.3.87

jobs:
  build-and-upload:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.20.14"
          cache-dependency-path: categraf/go.sum
      - name: Build and pack
        working-directory: categraf
        run: |
          set -euo pipefail
          for arch in 386 amd64; do
            CGO_ENABLED=0 GOOS=windows GOARCH="$arch" go build \
              -ldflags "-w -s -X flashcat.cloud/categraf/config.Version=v0.3.87" \
              -o "/tmp/categraf-$arch.exe" .
            mkdir -p "/tmp/pkg-$arch"
            cp "/tmp/categraf-$arch.exe" "/tmp/pkg-$arch/categraf.exe"
            cp -a conf "/tmp/pkg-$arch/conf"
            cp -a scripts "/tmp/pkg-$arch/scripts"
            cp LICENSE "/tmp/pkg-$arch/LICENSE"
            (cd "/tmp/pkg-$arch" && zip -r "/tmp/categraf-v0.3.87-windows7-$arch.zip" categraf.exe conf scripts LICENSE)
          done
      - name: Upload release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload v0.3.87 \
            /tmp/categraf-v0.3.87-windows7-386.zip \
            /tmp/categraf-v0.3.87-windows7-amd64.zip \
            --clobber --repo glj2369/categraf-win7-server2008
